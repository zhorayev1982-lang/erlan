<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>
      Ортағасырлық қалалар тарихы — 10 нұсқалы тест
    </title>
    <style>
      *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#1e293b;background:#f4f7fb}.screen{display:none}.screen.active{display:block}.start{max-width:790px;margin:45px auto;padding:35px;background:white;border-radius:16px;box-shadow:0 7px 25px #17255418}h1{text-align:center;font-size:32px;margin:0 0 26px}.sub{text-align:center;color:#64748b;margin-bottom:30px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}label{font-weight:bold;display:block;margin:0 0 10px;font-size:20px}input,select{width:100%;padding:14px;font-size:19px;border:2px solid #cbd5e1;border-radius:6px;background:white}input:focus,select:focus{outline:2px solid #2196f3}.variant{margin-top:28px;width:270px}.btn{background:#2196f3;color:white;border:0;border-radius:9px;padding:17px 32px;font-size:21px;font-weight:bold;cursor:pointer}.btn:hover{background:#1476c7}.btn:disabled{opacity:.5;cursor:default}.startbtn{display:block;margin:35px auto 0}.quiz{max-width:1260px;margin:0 auto;background:white;min-height:100vh;padding:26px 32px}.numbers{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:28px auto 36px}.num{min-width:57px;height:58px;border:1px solid #d0d0d0;background:white;border-radius:9px;font-size:19px;font-weight:bold;cursor:pointer}.num.current{border:3px solid #2196f3}.num.answered{background:#e8f2ff}.num.right{background:#d9f8e3;border-color:#1fa855}.num.wrong{background:#ffe2e2;border-color:#dc3545}.meta{color:#64748b;text-align:center;margin-top:-15px}.question{font-size:26px;font-weight:bold;margin:35px 0 30px;line-height:1.5}.answer{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #dedede;border-radius:9px;background:#f7f8fa;padding:19px 25px;margin:13px 0;font-size:23px;cursor:pointer;color:#111}.answer:hover:not(:disabled){border-color:#2196f3}.answer.correct{background:#d9f8e3;border:2px solid #20a655}.answer.incorrect{background:#ffe0e0;border:2px solid #d93636}.answer:disabled{cursor:default}.circle{width:20px;height:20px;border:2px solid #999;border-radius:50%;flex-shrink:0}.answer.chosen .circle{background:#2196f3;box-shadow:inset 0 0 0 4px white;border-color:#2196f3}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:35px}.feedback{font-size:18px;font-weight:bold;min-height:25px}.result{max-width:760px;margin:40px auto;padding:35px;background:white;border-radius:16px;box-shadow:0 7px 25px #17255418}.score{text-align:center;font-size:54px;color:#1681d4;font-weight:bold;margin:20px}.stat{padding:12px;border-bottom:1px solid #e2e8f0;font-size:20px}.review{margin-top:25px}.review p{padding:10px;border-bottom:1px solid #eee}@media(max-width:650px){.start,.result{margin:10px;padding:22px}.form-grid{grid-template-columns:1fr}.quiz{padding:18px}.question{font-size:21px}.answer{font-size:18px;padding:15px}.num{min-width:43px;height:45px}.btn{font-size:17px;padding:13px 16px}h1{font-size:25px}}
    </style>
  </head>
  <body>
    <section class="screen active" id="intro">
      <div class="start">
        <h1>
          Ортағасырлық қалалар тарихы бойынша тест
        </h1>
        <p class="sub">
          10 нұсқа · Әр нұсқада 20 сұрақ
        </p>
        <div class="form-grid">
          <div>
            <label for="student">
              Оқушының аты және тегі
            </label>
            <input autocomplete="name" id="student" placeholder="Аты-жөніңізді жазыңыз"/>
          </div>
          <div>
            <label for="grade">
              Сыныбы
            </label>
            <input id="grade" placeholder="Мысалы: 7А"/>
          </div>
        </div>
        <div class="variant">
          <label for="variant">
            Нұсқаны таңдаңыз
          </label>
          <select id="variant">
            <option value="">
              Нұсқаны таңдаңыз
            </option>
            <option value="1">
              1-нұсқа
            </option>
            <option value="2">
              2-нұсқа
            </option>
            <option value="3">
              3-нұсқа
            </option>
            <option value="4">
              4-нұсқа
            </option>
            <option value="5">
              5-нұсқа
            </option>
            <option value="6">
              6-нұсқа
            </option>
            <option value="7">
              7-нұсқа
            </option>
            <option value="8">
              8-нұсқа
            </option>
            <option value="9">
              9-нұсқа
            </option>
            <option value="10">
              10-нұсқа
            </option>
          </select>
        </div>
        <button class="btn startbtn" onclick="start()">
          Тестті бастау →
        </button>
      </div>
    </section>
    <section class="screen" id="quiz">
      <main class="quiz">
        <h1>
          Ортағасырлық қалалар тарихы бойынша тест
        </h1>
        <p class="meta" id="who">
        </p>
        <nav class="numbers" id="numbers">
        </nav>
        <div class="question" id="qtext">
        </div>
        <div id="options">
        </div>
        <p class="feedback" id="feedback">
        </p>
        <div class="actions">
          <button class="btn" id="back" onclick="index--;render()">
            ← Алдыңғы сұрақ
          </button>
          <button class="btn" id="next" onclick="next()">
            Келесі сұрақ
          </button>
        </div>
      </main>
    </section>
    <section class="screen" id="result">
      <div class="result">
        <h1>
          Тест нәтижесі
        </h1>
        <div class="score" id="score">
        </div>
        <div id="resultData">
        </div>
        <details class="review">
          <summary>
            <b>
              Жауаптарды толық қарау
            </b>
          </summary>
          <div id="review">
          </div>
        </details>
        <div class="actions">
          <button class="btn" onclick="window.print()">
            Нәтижені басып шығару
          </button>
          <button class="btn" onclick="restart()">
            Басты бет
          </button>
        </div>
      </div>
    </section>
    <script>
      const DATA=[[{"q": "568 жылы Түрік қағаны Дизабұл Византия елшілігін қай қалада қабылдады?", "a": ["Тараз", "Испиджаб", "Суяб", "Отырар"], "correct": 2}, {"q": "Қарахан мемлекетінің маңызды астаналарының бірі болған қала?", "a": ["Баласағұн", "Жент", "Сауран", "Сарайшық"], "correct": 0}, {"q": "Ортағасырлық қаладағы билеуші бекінісі орналасқан бөлік қалай аталады?", "a": ["Цитадель", "Керуен сарай", "Рабад", "Шахристан"], "correct": 0}, {"q": "Керуендер тоқтап, демалатын арнайы орын қалай аталды?", "a": ["Ұстахана", "Медресе", "Монша", "Керуен сарай"], "correct": 3}, {"q": "Отырар қаласы қай өзенге жақын орналасқан?", "a": ["Арыс", "Тобыл", "Нұра", "Есіл"], "correct": 0}, {"q": "Сауран қаласының ерекше қорғаныс құрылысы қандай болды?", "a": ["Теңіз флоты", "Мұз қамалы", "Ағаш көпірлер ғана", "Қалың қамал қабырғалары"], "correct": 3}, {"q": "Талғар қаласының ортағасырлық атауы қандай?", "a": ["Фараб", "Жанкент", "Талхиз", "Ясы"], "correct": 2}, {"q": "Қалалардағы тауар айырбастау орны қалай аталды?", "a": ["Мұнара", "Базар", "Цитадель", "Қорған"], "correct": 1}, 
{"q": "Ортағасырлық қалаларда су жеткізуге қолданылған жүйелердің бірі?", "a": ["Құбырлар мен арықтар", "Телеграф", "Электр желісі", "Теміржол"], "correct": 0}, {"q": "Жүсіп Баласағұни жазған шығарма?", "a": ["Диуани хикмет", "Кодекс Куманикус", "Жами ат-тауарих", "Құтты білік"], "correct": 3}, {"q": "751 жылғы Атлах шайқасы қай қала маңында өтті?", "a": ["Сауран", "Сығанақ", "Тараз", "Отырар"], "correct": 2}, {"q": "Жібек жолы атауы қай тауармен байланысты?", "a": ["Астық", "Жібек", "Тұз", "Темір"], "correct": 1}, {"q": "Испиджаб қаласының кейінгі белгілі атауы?", "a": ["Сайрам", "Сарайшық", "Жанкент", "Қойлық"], "correct": 0}, {"q": "Сарайшық қаласы қай өзен бойында орналасқан?", "a": ["Іле", "Шу", "Талас", "Жайық"], "correct": 3}, {"q": "Әбу Насыр әл-Фараби дүниеге келген өңірмен байланысты қала?", "a": ["Суяб", "Қойлық", "Тараз", "Отырар"], "correct": 3}, {"q": "Қожа Ахмет Ясауи кесенесі орналасқан қала?", "a": ["Қойлық", "Сауран", "Түркістан", "Талғар"], "correct": 2}, {"q": "Ортағасырлық қаланың негізгі тұрғындар мекендеген орталық бөлігі?", "a": ["Рабад", "Шахристан", "Керуен сарай", "Қорған"], "correct": 1}, {"q": "Тараз қаласы қай өзен аңғарында орналасқан?", "a": ["Талас", "Ертіс", "Жайық", "Есіл"], "correct": 0}, {"q": "Моңғол әскерлері Отырарды қоршауды қай жылы бастады?", "a": ["1227", "1256", "1206", "1219"], "correct": 3}, {"q": "Қойлық қаласы қай тарихи өңірде орналасқан?", "a": ["Үстірт", "Жетісу", "Маңғыстау", "Сарыарқа"], "correct": 1}], [{"q": "Тарихи деректерге сүйеніп жауап беріңіз: Ортағасырлық қаладағы қолөнершілер мен саудагерлер тұратын сыртқы бөлік?", "a": ["Цитадель", "Қамал", "Орда", "Рабад"], "correct": 3}, {"q": "Тарихи деректерге сүйеніп жауап беріңіз: Ұлы Жібек жолының басты тарихи қызметі қандай болды?", "a": ["Тек егін егу", "Тек аңшылық", "Тек соғыс жүргізу", "Сауда және мәдени байланыс"], "correct": 3}, {"q": "Тарихи деректерге сүйеніп жауап беріңіз: Отырар апаты қай жылы болды?", "a": ["960", "1219", "1465", "751"], "correct": 1 {"q": "Қала мәдениеті тақырыбы бойынша жауап беріңіз: Қарахан мемлекетінде ислам мемлекеттік дін ретінде қай жылы жарияланды?", "a": ["751", "1219", "1465", "960"], "correct": 3}, {"q": "Қала мәдениеті тақырыбы бойынша жауап беріңіз: Керуен саудасында кең пайдаланылған көлік жануары?", "a": ["Қабан", "Аю", "Түйе", "Бұғы"], "correct": 2}, {"q": "Қала мәдениеті тақырыбы бойынша жауап беріңіз: Қаланың сыртқы қорғаныс қабырғасының басты мақсаты?", "a": ["Кітап көшіру", "Жаудан қорғау", "Астық өсіру", "Кеме жасау"], "correct": 1}, {"q": "Қала мәдениеті тақырыбы бойынша жауап беріңіз: 568 жылы Түрік қағаны Дизабұл Византия елшілігін қай қалада қабылдады?", "a": ["Тараз", "Испиджаб", "Суяб", "Отырар"], "correct": 2}]];let variant=0,index=0,answers=[];const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function start(){let name=$('student').value.trim(),grade=$('grade').value.trim(),v=$('variant').value;if(!name||!grade||!v){alert('Аты-жөніңізді, сыныбыңызды және нұсқаны толтырыңыз.');return}variant=+v-1;index=0;answers=Array(20).fill(null);$('who').textContent=name+' | '+grade+' сынып | '+v+'-нұсқа';show('quiz');render()}function render(){const data=DATA[variant],item=data[index];$('qtext').textContent=(index+1)+'. '+item.q;$('numbers').innerHTML='';for(let i=0;i<20;i++){let b=document.createElement('button');b.className='num'+(i===index?' current':'')+(answers[i]!==null?(answers[i]===data[i].correct?' right':' wrong'):'');b.textContent=i+1;b.onclick=()=>{index=i;render()};$('numbers').appendChild(b)}$('options').innerHTML='';item.a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer';if(answers[index]!==null){b.disabled=true;if(i===item.correct)b.classList.add('correct');if(i===answers[index]&&i!==item.correct)b.classList.add('incorrect');if(i===answers[index])b.classList.add('chosen')}let c=document.createElement('span');c.className='circle';let t=document.createElement('span');t.textContent=String.fromCharCode(65+i)+') '+a;b.append(c,t);b.onclick=()=>{if(answers[index]===null){answers[index]=i;render()}};$('options').appendChild(b)});$('feedback').textContent=answers[index]===null?'':answers[index]===item.correct?'✓ Дұрыс жауап!':'✗ Қате жауап. Дұрыс жауап жасыл түспен көрсетілген.';$('feedback').style.color=answers[index]===item.correct?'#168a42':'#cc3434';$('back').disabled=index===0;$('next').textContent=index===19?'Тестті аяқтау':'Келесі сұрақ';$('next').disabled=answers[index]===null}function next(){if(index===19){finish();return}index++;render()}function finish(){let missing=answers.filter(x=>x===null).length;if(missing){if(!confirm(missing+' сұрақ жауапсыз қалды. Тестті аяқтайсыз ба?'))return}let correct=answers.filter((a,i)=>a===DATA[variant][i].correct).length;let pct=Math.round(correct/20*100);let grade=pct>=90?'5':pct>=70?'4':pct>=50?'3':'2';$('resultData').innerHTML='';[['Оқушы',$('student').value],['Сыныбы',$('grade').value],['Нұсқа',(variant+1)+'-нұсқа'],['Дұрыс жауап',correct+' / 20'],['Қате жауап',answers.filter((a,i)=>a!==null&&a!==DATA[variant][i].correct).length],['Жауапсыз',missing],['Нәтиже',pct+'%'],['Баға',grade]].forEach(([k,v])=>{let d=document.createElement('div');d.className='stat';d.textContent=k+': '+v;$('resultData').appendChild(d)});$('score').textContent=pct+'%';let review=$('review');review.innerHTML='';DATA[variant].forEach((q,i)=>{let p=document.createElement('p');p.style.color=answers[i]===q.correct?'#168a42':'#c43131';p.textContent=(i+1)+'. '+(answers[i]===q.correct?'✓':'✗')+' '+q.q+' — Дұрыс жауап: '+q.a[q.correct];review.appendChild(p)});show('result')}function restart(){show('intro')}
